# Lean core (PLAN.md Step 0): Postgres 17 + pgvector 0.8.7 only. GROBID joins in P3.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: rlg
      POSTGRES_PASSWORD: rlg
      POSTGRES_DB: rlg
    ports:
      - "${RLG_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rlg -d rlg"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
