# LLM tiers (PLAN.md §0 #2). Every LLM call names a tier; llm/ resolves it here.
# Prices are USD per million tokens (Anthropic first-party list prices, 2026-10).
# training_cutoff feeds the leakage probe (P9-02): llm_call.model_cutoff.
# Gemini vs Claude per tier is an open decision (PLAN.md §5), set after the P4 cost model.
version: 1
tiers:
  triage:
    provider: anthropic
    model: claude-haiku-5-5
    training_cutoff: 2026-06-01   # unverified: confirm from the model card
    input_usd_per_mtok: 0.10
    output_usd_per_mtok: 0.50
    batch_discount: 0.5
    max_output_tokens: 1024
  extract:
    provider: anthropic
    model: claude-sonnet-5-5
    training_cutoff: 2026-06-01   # unverified: confirm from the model card
    input_usd_per_mtok: 2.00
    output_usd_per_mtok: 10.00
    batch_discount: 0.5
    max_output_tokens: 16000
  adjudicate:
    provider: anthropic
    model: claude-opus-5-5
    training_cutoff: 2026-06-01
    input_usd_per_mtok: 4.00
    output_usd_per_mtok: 20.00
    batch_discount: 0.5
    max_output_tokens: 16000
  # Example Gemini tier (needs GEMINI_API_KEY):
  # triage:
  #   provider: gemini
  #   model: <gemini model id>
  #   ...
budgets:
  daily_llm_usd: 5.0          # DAILY_LLM_BUDGET_USD in .env overrides this
  triage_daily_usd: 1.0
