# Seed canonical concepts for concept ER (P5-04 loads ~300 of these). STUB: format only.
# PLAN.md Step 5b: auto-merge only on a curated alias hit; version markers (Verified, Lite,
# v2, 7B, -Instruct, ...) never merge -- they become variant_of / subset_of links.
# Will also be seeded from the frozen Papers with Code archive.
#
# kind: method|task|benchmark|dataset|metric|harness|tool_protocol|skill_format
# aliases: curated (source=curated); case/acronym normalisation happens in code.
# variant_of / subset_of: name of another concept in this file.
version: 0
concepts:
