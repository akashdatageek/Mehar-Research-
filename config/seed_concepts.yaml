  - {name: "Reflexion", kind: method, aliases: []}
  - {name: "Tree of Thoughts", kind: method, aliases: ["ToT"]}
  - {name: "CodeAct", kind: method, aliases: ["executable code actions"]}
  - {name: "SWE-bench", kind: benchmark, aliases: ["SWEbench", "SWE bench"]}
  - {name: "SWE-bench Verified", kind: benchmark, aliases: [], subset_of: "SWE-bench"}
  - {name: "SWE-bench Lite", kind: benchmark, aliases: [], subset_of: "SWE-bench"}
  - {name: "WebArena", kind: benchmark, aliases: []}
  - {name: "VisualWebArena", kind: benchmark, aliases: ["VWA"], variant_of: "WebArena"}
  - {name: "pass@1", kind: metric, aliases: ["pass at 1"]}
