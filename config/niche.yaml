# Niche definition for Step 2 (Filter / triage). PLAN.md Step 2, item 0.
#
# Used by:
#   P2-01  Layer 1 rules (categories + keywords below)
#   P2-02  bootstrap labels (in_anchors as positives; near_miss_out as hard negatives)
#   P2-05  Layer 2 scorer (kNN-to-anchor feature uses in_anchors; near misses as negatives)
#   P2-06  Layer 3 cheap-LLM prompt (definition + include/exclude lists go into
#          prompts/<triage prompt>.md, never inline)
#
# arXiv ids and titles verified against the arXiv API on 2026-10-20.
# STATUS: draft by Claude Code; Mehar should review the definition and the out list
# before gate H0.

version: 1

definition: >-
  Research on systems in which a large language model (or vision-language model) acts as
  an agent: it chooses actions over multiple steps, calls tools, APIs or code, plans,
  keeps memory, coordinates with other agents, or is run inside a harness/scaffold.
  Includes the harnesses, tool interfaces and protocols (e.g. MCP), agent skills and
  skill formats, agent training on trajectories, and the benchmarks/environments built
  to evaluate such agents. Scope is 2022 to today.

include:
  - LLM-based agents that act in an environment (web, OS, code repo, game, embodied) via an LLM policy
  - tool use, function calling, API calling, code-as-action
  - planning, search over reasoning/action trees, self-reflection and self-critique loops
  - agent memory (episodic, retrieval-based, workflow/skill libraries)
  - multi-agent LLM systems (role-playing, debate, orchestration frameworks)
  - harnesses / scaffolds / agent-computer interfaces, tool protocols, agent skills
  - agent benchmarks and environments, and evaluation methodology for agents
  - training LLMs for agentic behaviour (trajectory fine-tuning, RL on agent tasks)
  - prompting methods that agents build on (chain-of-thought lineage) when the paper is an agent ancestor

exclude:
  - reinforcement-learning agents without a language-model policy (robotics, games, MARL)
  - classical agent-based simulation / multi-agent systems (ABM, BDI) without LLMs
  - chatbots and assistants that do not use tools or act over multiple steps
  - LLM pretraining, instruction tuning, alignment and general capability evals with no agent component
  - retrieval-augmented generation with a fixed retrieve-then-read pipeline (no agentic choice)
  - code generation models evaluated only on single-shot generation
  - vision-language-action robot policies trained end to end (no LLM planner, tools or memory)

# Layer 1 (P2-01) starting values. [assumption] Deliberately generous; recall is measured
# on the gold set. Papers within one citation hop of an anchor bypass Layer 1.
layer1:
  categories: [cs.CL, cs.AI, cs.LG, cs.SE, cs.MA, cs.IR, cs.HC]
  keywords:
    - agent
    - agentic
    - tool use
    - tool-use
    - tool learning
    - function calling
    - api call
    - planning
    - planner
    - multi-agent
    - harness
    - scaffold
    - mcp
    - model context protocol
    - skill
    - memory
    - reflection
    - self-refine
    - web navigation
    - computer use
    - gui
    - swe-bench
    - autonomous

