# Slice-1 anchor lineages: AI agents + harnesses / tools / skills (2022 -> today).
#
# Used by:
#   P0-07  fixture downloader (`fixture: true` marks the 20 fixture papers; `pdf_only: true`
#          marks the 3 used by the PDF fallback test -- they do have arXiv HTML, so P3-04
#          forces the PDF path, see PLAN.md "Approved deviations")
#   P2-02  triage bootstrap positives (anchors + papers citing >= 2 anchors); see also
#          config/niche.yaml, which lists these plus extra in-niche examples
#   P6     backfill scope = filter + one citation hop around these anchors (PLAN.md Step 6)
#   P6-05 / P8-03  anchor lineage check: each predecessor link should appear as a path in
#          freeze(T=2025-12-31, R=now, strict=true)
#
# Each entry: id, kind (paper|artifact), title, year, arxiv_id (papers) or url (artifacts),
# predecessors: [{anchor, type, component?, note?}] where the link reads
#   <this> --type--> <anchor>          (e.g. ReAct --extends--> CoT)
# `type` uses the edge enum (PLAN.md Step 4 / PLAN_v2_base data model); paper->paper links
# use the paper-level types (extends, combines, replaces_component, transplants_domain,
# refutes_or_contradicts, evaluates_on, compares_against, subset_of, cites).
# `component` uses the agent-component enum.
#
# arXiv ids: verified against the arXiv API (export.arxiv.org/api/query) on 2026-10-20 --
# every id resolves and its title matches the `title` below (case/punctuation-insensitive).
#
# STATUS: links curated by Claude Code from the literature; Mehar should review the `type`
# of each link before gate H1. Link types are a lineage judgement, not extracted facts.

